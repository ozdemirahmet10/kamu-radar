global:
  scrape_interval: 15s

scrape_configs:
  - job_name: kamu-radar-api
    metrics_path: /api/v1/metrics
    static_configs:
      # 'api' compose servisinin adı - api container'ı bu compose ağında çalışırken geçerlidir.
      # Yerel geliştirmede backend host üzerinde (npm run start:dev ile) çalışıyorsa
      # bunun yerine 'host.docker.internal:3000' kullanın.
      - targets: ['api:3000']
